schema_version: "1.1"
name: backend-admin-sign-in
description: >
  A backend build order. Source: los-tres run 2026-10-22-admin-sign-in,
  slot 08, rebuilt from the design's Backend lane. The gates found no backend
  blocker in that run, so the graders check the design's settled decisions
  (06-design § Decisions), which a lane is told to build to and not re-decide.
  No shell in evals on this machine: no install, no migration generation.
tags: [build, backend, los-tres]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 80
  timeout_seconds: 2400
  allowed_tools: [Agent, Read, Glob, Grep]
  prompt: |
    You are the orchestrator of a .agentic run in this repository. Do one thing:
    read `agentic/project.md` § the lane table, find the agent it names for the
    `backend` lane, and dispatch it (as `agentic-core:<that agent>`) with
    exactly the work order below. Do not write code yourself.
    When it returns, reply with its REPORT HEAD and nothing else.

    WORK ORDER eval-2026-10-22-admin-sign-in/08
    lane:        backend
    mode:        NONE
    agentic_root: .agentic-root (relative to the repo root)
    run_dir:     agentic/runs/eval-2026-10-22-admin-sign-in
    report_to:   agentic/runs/eval-2026-10-22-admin-sign-in/08-backend.md
    story:       docs/product/stories/US-2.1-admin-sign-in.md
    tickets:     T2.1.1, T2.1.2, T2.1.3, T2.1.4

    goal:        an admin can be created from the command line and can sign in and out through server actions, behind a role check every admin page and action calls

    scope:
      - package.json
      - src/db/schema/auth.ts
      - src/db/schema/index.ts
      - src/config/auth.ts
      - src/server/auth/**
      - src/cli/create-admin.ts
      - src/cli/stdin.ts
      - docker-entrypoint.sh
      - compose.yaml
      - .env.example
      - scripts/init-env.mjs
      - next.config.ts
      - agentic/runs/eval-2026-10-22-admin-sign-in/08-backend.md

    inputs:
      - agentic/runs/eval-2026-10-22-admin-sign-in/06-design.md (§ Framework pick, § Data model, § Contract, § Lanes › Backend, § Decisions)
      - agentic/runs/eval-2026-10-22-admin-sign-in/07-recon.md
      - agentic/runs/eval-2026-10-22-admin-sign-in/decisions.md

    definition_of_done:
      - the guard, the sign-in and sign-out actions and the create-admin CLI match 06-design § Contract
      - every decision in 06-design § Decisions holds in the code

    non_goals:
      - frontend pages or components, tests, docs
      - running npm install or generating the migration (no shell here) — edit package.json by hand and say so in risks

    verification:  NONE — this environment has no shell; say in risks what you would have run
graders:
  - name: report-written
    type: regex
    pattern: '^REPORT (eval-)?2026-10-22-admin-sign-in/08'
    flags: m
    target: { source: file, path: agentic/runs/eval-2026-10-22-admin-sign-in/08-backend.md }
  - name: no-http-handler
    type: regex
    pattern: 'toNextJsHandler\('
    match: not_contains
    target: { source: file, path: src/server/auth/auth.ts }
  - name: guard-contract
    type: llm
    weight: 2
    focus: { source: file, path: src/server/auth/guard.ts }
    criteria: |
      PASS if the guard's results are exactly admin | anonymous | unavailable,
      an unreachable store yields unavailable (fail closed, never admin), and
      there is a page guard and an action guard (requireAdminPage /
      requireAdminAction or equivalent names).
      FAIL if a store error can yield admin or anonymous-as-success, or the
      result names differ from the design.
  - name: config-decisions
    type: llm
    weight: 2
    focus: { source: file, path: src/server/auth/config.ts }
    criteria: |
      PASS if all hold: the session cookie is SameSite=Strict (not the
      framework default Lax); rate limiting is off; the session lifetime comes
      from a single SESSION_LIFETIME_HOURS constant (8 h) rather than a
      literal repeated elsewhere.
      FAIL if any one fails. If the settings live in another file this one
      imports, judge from what this file shows and FAIL only on a
      contradiction you can see.
  - name: email-normalised
    type: llm
    focus: { source: file, path: src/server/auth/accounts.ts }
    criteria: |
      PASS if emails are trimmed and lowercased in this code (e.g. a
      normalizeEmail function) before every lookup and write.
      FAIL if normalisation is left to the framework or missing.
  - name: stays-in-scope
    type: regex
    weight: 2
    # Fails when any line of the report's changed list falls outside the
    # order's scope (lockfiles allowed, since the order adds a dependency),
    # or is a test file.
    pattern: '^changed:\n(?:  - .*\n)*?  - (?:(?!package\.json|pnpm-lock\.yaml|package-lock\.json|src/db/schema/auth\.ts|src/db/schema/index\.ts|src/config/auth\.ts|src/server/auth/|src/cli/create-admin\.ts|src/cli/stdin\.ts|docker-entrypoint\.sh|compose\.yaml|\.env\.example|scripts/init-env\.mjs|next\.config\.ts|agentic/runs/)|\S*\.(?:test|spec)\.)'
    flags: m
    match: not_contains
    target: { source: file, path: agentic/runs/eval-2026-10-22-admin-sign-in/08-backend.md }
