schema_version: "1.1"
name: intake-docs-only
description: >
  Intake on a docs-only request, where most phases must NOT fire. Source:
  los-tres run 2026-11-18-fitment-wording-docs (issue #297), which ran two docs
  dispatches, the integration gate and nothing else, on an intake budget of 3.
  The negatives are the point: an orchestrator that opens framing, a story or a
  UX pass for a wording change is spending dispatches on nothing.
tags: [intake, los-tres]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 40
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are in a repository bound to the .agentic network. A user request
    follows. Load the `agentic-core:orchestrate-feature` skill and do the
    reading and deciding of its Intake: bind, read what it tells you to read,
    give every row of the project's Phases table a verdict for this request,
    and derive the budget.

    This is an evaluation. There is no shell, no tracker and no write access:
    create no file, dispatch no agent, ask no question. Where intake would
    read an issue from the tracker, the issue text is given below. Decide
    from the request, the issue text, the repository and the profile.

    Request: "work on #297"

    Issue #297 - Docs: settle the S5.8 fitment wording and drop stale
    privacy-page notes. Docs-only follow-up. No code change.
    - The owner approved the S5.8 wording in `docs/product/vehicle-fitment.md`
      rule 3 and in decision 0016. Remove the "for the owner to review"
      markers.
    - The privacy page was fixed in S5.8. Still describing it as open or
      pending: `vehicle-fitment.md` rule 5,
      `docs/product/stories/US-5.7-select-car.md` and the 0016 Consequences
      line. Mark those resolved.
    - `docs/product/stories/US-3.1-admin-feeds.md` around line 183: the clause
      saying US-5.6 and US-5.9 disagree on S3.5 is out of date.

    End your reply with exactly this block and nothing after it. One line per
    row, `FIRES` or `NOT-TRIGGERED` and then the clause you judged it on:

    PHASES
    ground-truth/recon: <FIRES|NOT-TRIGGERED> - <why>
    framing/product: <FIRES|NOT-TRIGGERED> - <why>
    specification/story: <FIRES|NOT-TRIGGERED> - <why>
    design/ux: <FIRES|NOT-TRIGGERED> - <why>
    design/design: <FIRES|NOT-TRIGGERED> - <why>
    build: <FIRES|NOT-TRIGGERED> - <lanes>
    verify/integration: <FIRES|NOT-TRIGGERED> - <why>
    verify/ux-review: <FIRES|NOT-TRIGGERED> - <why>
    verify/review: <FIRES|NOT-TRIGGERED> - <why>
    close/docs: <FIRES|NOT-TRIGGERED> - <why>
    BUDGET: <integer>
    HUMAN-STOPS: <comma-separated phases that fire and stop for the human, or none>
graders:
  - name: block-present
    type: regex
    pattern: '^\s*PHASES\s*$[\s\S]*^\s*BUDGET:\s*\d+'
    flags: mi
  - name: framing-not
    type: regex
    pattern: '^\s*framing/product:\s*NOT-TRIGGERED\b'
    flags: mi
    weight: 2
  - name: story-not
    type: regex
    pattern: '^\s*specification/story:\s*NOT-TRIGGERED\b'
    flags: mi
    weight: 2
  - name: ux-not
    type: regex
    pattern: '^\s*design/ux:\s*NOT-TRIGGERED\b'
    flags: mi
    weight: 2
  - name: ux-review-not
    type: regex
    pattern: '^\s*verify/ux-review:\s*NOT-TRIGGERED\b'
    flags: mi
  - name: review-not
    type: regex
    pattern: '^\s*verify/review:\s*NOT-TRIGGERED\b'
    flags: mi
  - name: build-fires
    type: regex
    pattern: '^\s*build:\s*FIRES\b'
    flags: mi
  - name: integration-fires
    type: regex
    pattern: '^\s*verify/integration:\s*FIRES\b'
    flags: mi
  - name: budget-small
    type: regex
    pattern: '^\s*BUDGET:\s*[2-5]\s*$'
    flags: mi
